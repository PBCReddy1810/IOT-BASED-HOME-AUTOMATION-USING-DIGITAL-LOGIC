; PlatformIO Project Configuration File for ESP32 Smart Home Automation
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_FREERTOS_HZ=1000

lib_deps =
    ; Built-in BLE and WiFi libraries used
